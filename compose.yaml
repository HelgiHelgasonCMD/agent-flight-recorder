# Optional Qdrant server. afr uses embedded Qdrant by default; set
# AFR_QDRANT_URL=http://localhost:6333 to use this instead (needed for concurrent access
# from several processes, and for payload indexes, which embedded mode ignores).
services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant-data:
